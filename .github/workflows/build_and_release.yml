name: Build and Release Debian Package

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:

  build:
    name: Build Debian Package (${{ matrix.variant }})
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          # Rockchip RK3588 (libmali-rockchip): the CMake defaults.
          - variant: rockchip
            cmake_args: ""
            version_suffix: ""
          # CIX P1 (libmali-cix): CIX's libmali allocates from /dev/dma_heap/system, and mesa-cix's zink
          # trusts the Mali driver itself, so the layer reports it as it is (not layered on PanVK).
          - variant: cix
            cmake_args: "-DWSIALLOC_MEMORY_HEAP_NAME=system -DWSI_REPORT_LAYERED_DRIVER_DEFAULT=OFF -DWSI_DMABUF_HEAP_COHERENT=ON"
            version_suffix: "+cix"
    steps:

      - name: Fix Git Permissions
        run: |
          mkdir -p ~/.config/git
          chmod -R 700 ~/.config

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            devscripts \
            cmake \
            pkg-config \
            libdrm-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb1-dev \
            libxcb-dri3-dev \
            libxcb-present-dev \
            libxcb-randr0-dev \
            libxcb-shm0-dev \
            libxcb-sync-dev \
            libxrandr-dev \
            libvulkan-dev \
            libwayland-bin \
            libwayland-client0 \
            libwayland-dev \
            wayland-protocols
          sudo apt-get clean autoclean --yes
          sudo apt-get autoremove --yes
          sudo rm -rf /var/cache/apt/archives* /var/lib/apt/lists/*

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch up-to-date Vulkan headers
        # The distro's libvulkan-dev is older than the headers current upstream needs (>= 1.4.353,
        # for the VK_KHR_extended_flags / VK_EXT_multisampled_render_to_swapchain types it pulls in
        # unconditionally), so build against a pinned Vulkan-Headers checkout instead of the system
        # headers. The pin matches the version upstream validates against (WSI_LAYER_VK_PATCH).
        run: |
          git clone --depth 1 --branch v1.4.356 \
            https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/vulkan-headers"
          echo "VULKAN_CXX_INCLUDE=$RUNNER_TEMP/vulkan-headers/include" >> "$GITHUB_ENV"

      - name: Version the variant
        if: matrix.version_suffix != ''
        run: |
          dch --local "${{ matrix.version_suffix }}" --distribution UNRELEASED \
            "Build for ${{ matrix.variant }}: ${{ matrix.cmake_args }}"

      - name: Build Debian package
        # -e forwards the env vars through debuild's sanitised environment to debian/rules.
        env:
          WSI_CMAKE_ARGS: ${{ matrix.cmake_args }}
        run: |
          debuild -e VULKAN_CXX_INCLUDE -e WSI_CMAKE_ARGS -us -uc -b && cp -a ../*.deb ./

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.variant }}
          path: ./*.deb
          if-no-files-found: error

  # One release per commit with every variant's package: the tag carries the base version (without a variant's
  # local suffix) and the commit.
  release:
    name: Release Debian Packages
    needs: build
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: debs
          merge-multiple: true

      - name: Get tag
        id: get_tag
        run: |
          version=$(sed -n '1s/^[^(]*(\([^)]*\)).*/\1/p' debian/changelog)
          echo "tag=v${version}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          ls -l debs

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ steps.get_tag.outputs.tag }}
          tag_name: ${{ steps.get_tag.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            debs/*.deb
